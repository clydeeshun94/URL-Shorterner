<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>snip.ly — Free URL Shortener</title>
  <style>
    :root {
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --surface2:    #22263a;
      --border:      #2e3250;
      --accent:      #6c63ff;
      --accent-h:    #857dff;
      --accent-soft: rgba(108,99,255,.14);
      --text:        #e8eaf6;
      --muted:       #7b7f9e;
      --dim:         #4a4e6a;
      --green:       #22c55e;
      --red:         #ef4444;
      --orange:      #f59e0b;
      --r:           12px;
      --r-sm:        8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:var(--bg);color:var(--text);min-height:100vh;padding:32px 16px 72px}

    /* Layout */
    .wrap{max-width:660px;margin:0 auto}

    /* Header */
    .header{text-align:center;margin-bottom:40px}
    .logo{font-size:30px;font-weight:900;letter-spacing:-1px}
    .logo span{color:var(--accent)}
    .tagline{margin-top:6px;font-size:14px;color:var(--muted)}

    /* Card */
    .card{background:var(--surface);border:1px solid var(--border);
          border-radius:var(--r);padding:28px;margin-bottom:20px}

    /* Tabs */
    .tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--border);
          border-radius:var(--r-sm);padding:4px;margin-bottom:24px}
    .tab{flex:1;padding:9px 0;text-align:center;font-size:13px;font-weight:600;
         border-radius:6px;cursor:pointer;border:none;background:transparent;
         color:var(--muted);transition:all .18s}
    .tab.active{background:var(--surface2);color:var(--text)}
    .tab:hover:not(.active){color:var(--text)}
    .tab-panel{display:none}
    .tab-panel.active{display:block}

    /* Form */
    .field{margin-bottom:14px}
    label{display:block;font-size:11px;font-weight:700;color:var(--muted);
          margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
    input[type=text],input[type=url],select{
      width:100%;padding:11px 14px;background:var(--bg);
      border:1px solid var(--border);border-radius:var(--r-sm);
      color:var(--text);font-size:14px;outline:none;transition:border-color .15s}
    input:focus,select:focus{border-color:var(--accent)}
    input::placeholder{color:var(--dim)}
    select option{background:var(--surface)}
    .hint{font-size:11px;color:var(--dim);margin-top:5px}
    .row{display:flex;gap:10px}
    .row .field{flex:1}

    /* Buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
         padding:11px 20px;border-radius:var(--r-sm);font-size:14px;font-weight:600;
         cursor:pointer;border:none;transition:all .15s;text-decoration:none}
    .btn-primary{background:var(--accent);color:#fff;width:100%}
    .btn-primary:hover{background:var(--accent-h);transform:translateY(-1px)}
    .btn-primary:active{transform:none}
    .btn-sm{padding:6px 12px;font-size:12px}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
    .btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .btn-danger{background:transparent;border:1px solid transparent;color:var(--muted)}
    .btn-danger:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.1)}
    .btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

    /* Result */
    .result{background:var(--accent-soft);border:1px solid var(--accent);
            border-radius:var(--r-sm);padding:16px;margin-top:16px;display:none}
    .result.show{display:block}
    .result-label{font-size:11px;font-weight:700;color:var(--accent);
                  text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
    .result-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .result-url{flex:1;font-size:16px;font-weight:700;color:var(--text);
                word-break:break-all;text-decoration:none}
    .result-url:hover{color:var(--accent)}
    .result-meta{font-size:12px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
    .result-meta a{color:var(--dim);text-decoration:none;font-size:11px}
    .result-meta a:hover{color:var(--accent)}

    /* Alerts */
    .alert{padding:12px 14px;border-radius:var(--r-sm);font-size:13px;
           margin-top:14px;display:none}
    .alert.show{display:block}
    .alert-err{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
    .alert-warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.3);color:#fcd34d}

    /* URL list */
    .list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .list-title{font-size:12px;font-weight:700;color:var(--muted);
                text-transform:uppercase;letter-spacing:.5px}
    .badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;
           font-size:11px;font-weight:600;padding:2px 8px;color:var(--muted)}

    .url-item{background:var(--surface2);border:1px solid var(--border);
              border-radius:var(--r-sm);padding:14px 16px;margin-bottom:8px;
              transition:border-color .15s}
    .url-item:hover{border-color:var(--accent)}
    .url-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .url-left{min-width:0;flex:1}
    .url-code{font-size:15px;font-weight:700;color:var(--accent)}
    .url-code a{color:inherit;text-decoration:none}
    .url-orig{font-size:12px;color:var(--muted);margin-top:3px;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .url-actions{display:flex;gap:4px;flex-shrink:0}
    .url-meta{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
    .url-meta span{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px}
    .dot{color:var(--green);font-size:14px;line-height:1}
    .dot.zero{color:var(--dim)}
    .exp-badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;
               background:rgba(245,158,11,.15);color:var(--orange);
               border:1px solid rgba(245,158,11,.3)}

    /* Analytics panel */
    .a-panel{display:none;background:var(--bg);border:1px solid var(--border);
             border-radius:var(--r-sm);padding:16px;margin-top:10px}
    .a-panel.open{display:block}
    .a-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .stat{background:var(--surface);border:1px solid var(--border);
          border-radius:var(--r-sm);padding:12px;text-align:center}
    .stat-v{font-size:22px;font-weight:800}
    .stat-l{font-size:10px;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
    table.ct{width:100%;border-collapse:collapse;font-size:12px}
    table.ct th{color:var(--dim);text-align:left;padding:6px 8px;font-weight:600;
                border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase}
    table.ct td{padding:7px 8px;border-bottom:1px solid rgba(46,50,80,.5);color:var(--muted)}
    table.ct tr:last-child td{border-bottom:none}
    .no-data{text-align:center;padding:16px;color:var(--dim);font-size:12px}

    /* Empty state */
    .empty{text-align:center;padding:40px 20px;color:var(--dim)}
    .empty .icon{font-size:36px;margin-bottom:10px}

    /* Toast */
    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(12px);
           background:var(--surface2);border:1px solid var(--border);padding:10px 20px;
           border-radius:20px;font-size:13px;font-weight:600;color:var(--text);
           opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;
           white-space:nowrap;z-index:999}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* Spinner */
    .sp{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);
        border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    hr{border:none;border-top:1px solid var(--border);margin:20px 0}

    @media(max-width:480px){
      .row{flex-direction:column}
      .a-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>
<body>
<div id="toast"></div>
<div class="wrap">

  <div class="header">
    <div class="logo">snip<span>.</span>ly</div>
    <div class="tagline">Paste a URL. Get a short link. No account needed.</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" data-tab="shorten">✂️ Shorten</button>
      <button class="tab" data-tab="mylinks">🔗 My Links</button>
      <button class="tab" data-tab="lookup">🔍 Inspect</button>
    </div>

    <!-- ── Shorten ── -->
    <div class="tab-panel active" id="tab-shorten">
      <form id="shortenForm" autocomplete="off">
        <div class="field">
          <label>Destination URL</label>
          <input type="url" id="url" placeholder="https://example.com/very/long/path…" required>
        </div>
        <div class="row">
          <div class="field">
            <label>Custom alias <span style="font-weight:400;color:var(--dim)">(optional)</span></label>
            <input type="text" id="alias" placeholder="my-link" maxlength="32">
            <div class="hint">3–32 chars · letters, numbers, - _</div>
          </div>
          <div class="field">
            <label>Expires</label>
            <select id="ttl">
              <option value="never">Never</option>
              <option value="1h">1 hour</option>
              <option value="24h">24 hours</option>
              <option value="7d">7 days</option>
              <option value="30d">30 days</option>
            </select>
          </div>
        </div>
        <button class="btn btn-primary" type="submit" id="shortenBtn">Shorten URL</button>
      </form>

      <div class="alert alert-err"  id="sErr"></div>
      <div class="alert alert-warn" id="sWarn"></div>

      <div class="result" id="resultBox">
        <div class="result-label">✓ Your link is ready</div>
        <div class="result-row">
          <a class="result-url" id="resultUrl" href="#" target="_blank"></a>
          <button class="btn btn-sm btn-ghost" id="copyBtn">Copy</button>
        </div>
        <div class="result-meta">
          <span id="resultExpiry"></span>
          <a id="previewLink" href="#" target="_blank">Preview page ↗</a>
        </div>
      </div>
    </div>

    <!-- ── My Links ── -->
    <div class="tab-panel" id="tab-mylinks">
      <div id="myLinksWrap">
        <div class="empty"><div class="icon">⏳</div><p>Loading your links…</p></div>
      </div>
    </div>

    <!-- ── Inspect ── -->
    <div class="tab-panel" id="tab-lookup">
      <form id="inspectForm" autocomplete="off" style="display:flex;gap:10px;margin-bottom:20px">
        <div class="field" style="flex:1;margin-bottom:0">
          <input type="text" id="inspectCode" placeholder="Short code, e.g. aB3x9Qz" required maxlength="64">
        </div>
        <button class="btn btn-ghost" type="submit" style="height:42px;flex-shrink:0">Inspect</button>
      </form>
      <div class="alert alert-err" id="iErr"></div>
      <div id="inspectResult"></div>
    </div>
  </div>

</div><!-- /wrap -->

<script>
// ── Tab switching ──────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    if (t.dataset.tab === 'mylinks') loadMyLinks();
  });
});

// ── Toast ──────────────────────────────────────────────────────────────────
let _tt;
function toast(msg, ms = 2400) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('show'), ms);
}

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function showAlert(el, msg) { el.textContent = msg; el.classList.add('show'); }
function clearAlerts(...els) { els.forEach(e => { e.textContent=''; e.classList.remove('show'); }); }
function fmtDate(s) { return s ? new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'; }

// ── Shorten ────────────────────────────────────────────────────────────────
const sForm = document.getElementById('shortenForm');
const sBtn  = document.getElementById('shortenBtn');
const sErr  = document.getElementById('sErr');
const sWarn = document.getElementById('sWarn');
const resultBox = document.getElementById('resultBox');
const resultUrl = document.getElementById('resultUrl');

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(resultUrl.href).then(() => toast('✓ Copied to clipboard'));
});

sForm.addEventListener('submit', async e => {
  e.preventDefault();
  clearAlerts(sErr, sWarn);
  resultBox.classList.remove('show');

  const url   = document.getElementById('url').value.trim();
  const alias = document.getElementById('alias').value.trim();
  const ttl   = document.getElementById('ttl').value;
  const body  = { url };
  if (alias) body.custom_alias = alias;
  if (ttl !== 'never') body.ttl = ttl;

  sBtn.disabled = true;
  sBtn.innerHTML = '<span class="sp"></span> Shortening…';

  try {
    const res  = await fetch('/api/shorten', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (res.status === 429) { showAlert(sWarn, '⚠️ ' + data.error); return; }
    if (!res.ok)            { showAlert(sErr,  data.error || 'Something went wrong'); return; }

    resultUrl.textContent = data.short_url;
    resultUrl.href        = data.short_url;
    document.getElementById('previewLink').href = data.preview_url;
    document.getElementById('resultExpiry').textContent =
      data.expires_at ? `Expires ${fmtDate(data.expires_at)}` : 'No expiry';
    resultBox.classList.add('show');
    toast('🎉 Link created!');
    sForm.reset();
    // Refresh My Links tab if it's loaded
    if (document.getElementById('tab-mylinks').classList.contains('active')) loadMyLinks();
  } catch (err) {
    showAlert(sErr, 'Network error: ' + err.message);
  } finally {
    sBtn.disabled = false;
    sBtn.innerHTML = 'Shorten URL';
  }
});

// ── My Links ──────────────────────────────────────────────────────────────
const myLinksWrap = document.getElementById('myLinksWrap');

async function loadMyLinks() {
  myLinksWrap.innerHTML = '<div class="empty"><div class="icon">⏳</div><p>Loading…</p></div>';
  try {
    const res  = await fetch('/api/my-urls');
    const data = await res.json();
    myLinksWrap.innerHTML = '';

    if (!data.urls || data.urls.length === 0) {
      myLinksWrap.innerHTML = '<div class="empty"><div class="icon">🔍</div><p>No links yet. Shorten something first!</p></div>';
      return;
    }

    const hdr = document.createElement('div');
    hdr.className = 'list-header';
    hdr.innerHTML = `<span class="list-title">Your links this session</span><span class="badge">${data.urls.length}</span>`;
    myLinksWrap.appendChild(hdr);
    data.urls.forEach(u => myLinksWrap.appendChild(buildUrlItem(u)));
  } catch (err) {
    myLinksWrap.innerHTML = `<div class="empty"><p style="color:#fca5a5">Failed to load: ${esc(err.message)}</p></div>`;
  }
}

function buildUrlItem(u) {
  const div   = document.createElement('div');
  div.className = 'url-item';
  div.id = 'item-' + u.short_code;

  const clicks   = u.clicks || 0;
  const expired  = u.expires_at && new Date(u.expires_at) < new Date();
  const expLabel = u.expires_at
    ? (expired ? `<span class="exp-badge">Expired</span>` : `<span class="exp-badge">Exp. ${fmtDate(u.expires_at)}</span>`)
    : '';

  div.innerHTML = `
    <div class="url-top">
      <div class="url-left">
        <div class="url-code">
          <a href="/${esc(u.short_code)}" target="_blank">/${esc(u.short_code)}</a>
        </div>
        <div class="url-orig" title="${esc(u.original_url)}">${esc(u.original_url)}</div>
      </div>
      <div class="url-actions">
        <button class="btn btn-sm btn-ghost" onclick="copyShort('${esc(u.short_code)}')">Copy</button>
        <button class="btn btn-sm btn-ghost" onclick="toggleStats('${esc(u.short_code)}')">Stats</button>
        <a class="btn btn-sm btn-ghost" href="/${esc(u.short_code)}+" target="_blank" title="Preview page">👁</a>
        <button class="btn btn-sm btn-danger" onclick="delUrl('${esc(u.short_code)}')">✕</button>
      </div>
    </div>
    <div class="url-meta">
      <span><span class="dot ${clicks === 0 ? 'zero' : ''}">●</span> ${clicks} click${clicks !== 1 ? 's' : ''}</span>
      <span>📅 ${fmtDate(u.created_at)}</span>
      ${expLabel}
    </div>
    <div class="a-panel" id="ap-${esc(u.short_code)}"></div>
  `;
  return div;
}

async function copyShort(code) {
  await navigator.clipboard.writeText(location.origin + '/' + code);
  toast('✓ Copied: ' + location.origin + '/' + code);
}

async function toggleStats(code) {
  const panel = document.getElementById('ap-' + code);
  if (panel.classList.contains('open')) { panel.classList.remove('open'); return; }
  panel.innerHTML = '<div style="color:var(--dim);font-size:12px;padding:8px 0">Loading…</div>';
  panel.classList.add('open');
  try {
    const res  = await fetch('/api/analytics/' + encodeURIComponent(code));
    const data = await res.json();
    if (!res.ok) { panel.innerHTML = `<div class="no-data">${esc(data.error)}</div>`; return; }
    panel.innerHTML = buildAnalyticsHtml(data);
  } catch { panel.innerHTML = '<div class="no-data">Network error</div>'; }
}

async function delUrl(code) {
  if (!confirm(`Delete /${code}? This cannot be undone.`)) return;
  try {
    const res  = await fetch('/api/urls/' + encodeURIComponent(code), {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' }
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('item-' + code)?.remove();
      toast('🗑 Deleted /' + code);
    } else {
      toast('⚠️ ' + (data.error || 'Delete failed'));
    }
  } catch (err) { toast('Network error: ' + err.message); }
}

// ── Inspect ────────────────────────────────────────────────────────────────
document.getElementById('inspectForm').addEventListener('submit', async e => {
  e.preventDefault();
  const iErr = document.getElementById('iErr');
  clearAlerts(iErr);
  document.getElementById('inspectResult').innerHTML = '';
  const code = document.getElementById('inspectCode').value.trim();
  if (!code) return;
  try {
    const res  = await fetch('/api/analytics/' + encodeURIComponent(code));
    const data = await res.json();
    if (!res.ok) { showAlert(iErr, data.error || 'Not found'); return; }
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div style="margin-bottom:14px">
        <div style="font-size:18px;font-weight:800;color:var(--accent)">/${esc(data.short_code)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:5px;word-break:break-all">
          → <a href="${esc(data.original_url)}" target="_blank" style="color:var(--muted)">${esc(data.original_url)}</a>
        </div>
      </div>
      ${buildAnalyticsHtml(data)}
    `;
    document.getElementById('inspectResult').appendChild(wrap);
  } catch (err) { showAlert(iErr, 'Network error: ' + err.message); }
});

// ── Shared analytics HTML ─────────────────────────────────────────────────
function buildAnalyticsHtml(data) {
  const lastClick = data.recent_clicks?.[0]?.clicked_at
    ? new Date(data.recent_clicks[0].clicked_at).toLocaleString() : '—';

  const rows = (data.recent_clicks || []).slice(0, 20).map(c => `
    <tr>
      <td>${esc(new Date(c.clicked_at).toLocaleString())}</td>
      <td>${esc(c.ip_address || '—')}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
          title="${esc(c.referrer)}">${esc(c.referrer || '—')}</td>
    </tr>
  `).join('');

  return `
    <div class="a-grid">
      <div class="stat"><div class="stat-v">${data.clicks}</div><div class="stat-l">Total clicks</div></div>
      <div class="stat"><div class="stat-v" style="font-size:13px;padding-top:4px">${esc(lastClick)}</div><div class="stat-l">Last click</div></div>
      <div class="stat"><div class="stat-v" style="font-size:13px;padding-top:4px">${fmtDate(data.created_at)}</div><div class="stat-l">Created</div></div>
    </div>
    ${rows
      ? `<table class="ct"><thead><tr><th>Time</th><th>IP</th><th>Referrer</th></tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="no-data">No clicks recorded yet.</div>'
    }
    ${data.expires_at ? `<div style="margin-top:10px;font-size:11px;color:var(--dim)">Expires: ${fmtDate(data.expires_at)}</div>` : ''}
  `;
}
</script>
</body>
</html>
