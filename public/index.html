<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 24px; color: #333; }
    form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    input, button { padding: 10px 14px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; }
    button { background: #0077b5; color: #fff; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #005f8f; }
    .result { background: #f0f9ff; border: 1px solid #b3d9ff; padding: 14px; border-radius: 6px; margin-bottom: 16px; word-break: break-all; }
    .error { background: #fff0f0; border: 1px solid #ffb3b3; padding: 14px; border-radius: 6px; margin-bottom: 16px; color: #cc0000; }
    .urls { margin-top: 24px; }
    .url-item { background: #f9f9f9; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .url-item a { color: #0077b5; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🔗 URL Shortener</h1>

  <form id="shortenForm">
    <input type="text" id="userId" placeholder="User ID" required>
    <input type="url" id="url" placeholder="Enter long URL" required>
    <button type="submit">Shorten</button>
  </form>

  <div id="output"></div>

  <div class="urls">
    <h2>Your URLs</h2>
    <form id="listForm" style="margin-bottom:12px;">
      <input type="text" id="listUserId" placeholder="User ID" required style="flex:1;">
      <button type="submit" style="padding:10px 20px;">List</button>
    </form>
    <div id="urlList"></div>
  </div>

  <script>
    const shortenForm = document.getElementById('shortenForm');
    const output = document.getElementById('output');
    const listForm = document.getElementById('listForm');
    const urlList = document.getElementById('urlList');

    shortenForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      output.innerHTML = '';
      const userId = document.getElementById('userId').value;
      const url = document.getElementById('url').value;

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url, user_id: userId })
        });
        const data = await res.json();
        if (res.ok) {
          output.innerHTML = `<div class="result">Shortened: <a href="${data.short_url}" target="_blank">${data.short_url}</a></div>`;
        } else {
          output.innerHTML = `<div class="error">${data.error}</div>`;
        }
      } catch (err) {
        output.innerHTML = `<div class="error">Request failed: ${err.message}</div>`;
      }
    });

    listForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      urlList.innerHTML = '';
      const userId = document.getElementById('listUserId').value;

      try {
        const res = await fetch(`/api/urls?user_id=${encodeURIComponent(userId)}`);
        const data = await res.json();
        if (data.urls.length === 0) {
          urlList.innerHTML = '<p>No URLs found.</p>';
          return;
        }
        data.urls.forEach(u => {
          urlList.innerHTML += `<div class="url-item"><a href="/${u.short_code}" target="_blank">${u.short_code}</a> → ${u.original_url}</div>`;
        });
      } catch (err) {
        urlList.innerHTML = `<div class="error">Request failed</div>`;
      }
    });
  </script>
</body>
</html>
